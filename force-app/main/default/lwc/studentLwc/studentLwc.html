<template>
    <!-- <div> 
        <div>Name:{name}</div> 
        <div>Company:{company}</div>
        <div>Position:{position}</div>
        <div>Salary:{salary}</div> 
    </div> -->
    <template if:true={record.data}>
        <lightning-card title="Student Profile" icon-name="standard:person_account">

            <div class="slds-p-around_medium">

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default">
                            <p class="slds-text-title_bold">Name</p>
                            <p>{name}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default">
                            <p class="slds-text-title_bold">Phone</p>
                            <p>{phone}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default">
                            <p class="slds-text-title_bold">Father Name</p>
                            <p>{fatherName}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-m-top_medium">
                        <div class="slds-box slds-theme_default">
                            <p class="slds-text-title_bold">Mother Name</p>
                            <p>{motherName}</p>
                        </div>
                    </div>
                </div>
            </div>
        </lightning-card>
    </template>


    
</template>
