<template>

    <!-- Card -->
    <lightning-card title="Student Management">

        <div class="slds-p-around_medium">

            <!-- Create Button -->
            <lightning-button
                label="Create Student"
                variant="brand"
                onclick={openModal}>
            </lightning-button>

        </div>

    </lightning-card>

    <!-- Record Edit Form -->
    <lightning-record-edit-form record-id={recordId} object-api-name="Student__c">
        <lightning-messages>
        </lightning-messages>

        <lightning-input-field field-name="Name__c"></lightning-input-field>
        <lightning-input-field field-name="Student_Email__c"></lightning-input-field>
        <lightning-input-field field-name="Phone__c"></lightning-input-field>
        <lightning-button
            class="slds-m-top_small"
            variant="brand"
            type="submit"
            label="Update">
        </lightning-button>
    </lightning-record-edit-form>

    <!-- Delete Button -->
    <div class="slds-m-top_small">
        <lightning-button
            type="button"
            variant="destructive"
            label="Delete Student"
            onclick={handleDelete}>
        </lightning-button>
    </div>

    <!-- Modal -->
    <template if:true={showModal}>

        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Select Record Type
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-radio-group
                        label="Choose Record Type"
                        options={recordTypeOptions}
                        value={selectedRecordTypeId}
                        onchange={handleRecordTypeChange}>
                    </lightning-radio-group>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>
                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Next"
                        onclick={handleNext}>
                    </lightning-button>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open">
        </div>

    </template>

</template>
